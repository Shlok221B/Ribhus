[project]
name = "ribhus"
version = "0.1.0"
description = "Open-source AI agent for India — Phase 3: skills + company research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ribhus" }]
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "ddgs>=9.0.0",
    "playwright>=1.45.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ribhus = "ribhus.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ribhus"]

[tool.hatch.build.targets.wheel.sources]
"src/ribhus" = "ribhus"

[tool.hatch.build.targets.wheel.force-include]
"src/ribhus/skills/bundled" = "ribhus/skills/bundled"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
